<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="robots" content="noindex">
<title>Dates d'examen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap">
<style>
/* Layout : une colonne de cartes ; gros bouton « + » qui ouvre une feuille d'ajout avec des choix à toucher */
:root {
  --bg: #eef1fb; --card: #ffffff; --fg: #1e2140; --muted: #6b7091; --line: #dfe3f3;
  --primary: #4f46e5; --primary-fg: #ffffff; --paid: #16a34a; --unpaid: #f97316; --danger: #e11d48;
  --f-display: "Fredoka", "Nunito", system-ui, sans-serif;
  --f-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14162a; --card: #1e2140; --fg: #eef0ff; --muted: #a3a8cc; --line: #2f3360;
  --primary: #8b85ff; --primary-fg: #14162a; --paid: #4ade80; --unpaid: #fb923c; --danger: #fb7185; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14162a; --card: #1e2140; --fg: #eef0ff; --muted: #a3a8cc; --line: #2f3360;
  --primary: #8b85ff; --primary-fg: #14162a; --paid: #4ade80; --unpaid: #fb923c; --danger: #fb7185; color-scheme: dark }
* { box-sizing: border-box }
html, body { min-height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.45; font-weight: 600 }
.wrap { max-width: 640px; margin: 0 auto; padding-block: calc(env(safe-area-inset-top, 0px) + 16px) calc(env(safe-area-inset-bottom, 0px) + 120px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap }
h1 { font-family: var(--f-display); font-size: 30px; font-weight: 700; margin: 0; line-height: 1.1 }
h1 .car { display: inline-block; animation: drive 3s ease-in-out infinite }
@keyframes drive { 0%,100% { transform: translateX(0) } 50% { transform: translateX(6px) } }
.summary { color: var(--muted); font-size: 15px; margin: 4px 0 0 }
.tabs { display: inline-flex; background: var(--card); border: 2px solid var(--line); border-radius: 99px; padding: 4px; gap: 4px }
.tab { font: inherit; font-weight: 800; border: none; background: transparent; color: var(--muted); padding: 8px 16px; border-radius: 99px; cursor: pointer }
.tab[aria-selected="true"] { background: var(--primary); color: var(--primary-fg) }
button { font: inherit; cursor: pointer }
button:focus-visible, input:focus-visible, .card:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px }

.list { display: grid; gap: 14px }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 16px; display: grid; gap: 14px;
  box-shadow: 0 4px 0 var(--line); cursor: pointer; transition: transform .15s }
.card:hover { transform: translateY(-2px) }
.card.past { opacity: .7 }
.top { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 14px; align-items: center }
.day { background: var(--primary); color: var(--primary-fg); border-radius: 18px; text-align: center; padding: 6px 0; font-variant-numeric: tabular-nums }
.day .n { font-family: var(--f-display); font-size: 30px; font-weight: 700; line-height: 1 }
.day .m { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em }
.past .day { background: var(--muted) }
.who { min-width: 0; display: grid; gap: 4px }
.name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap }
.name { font-family: var(--f-display); font-size: 21px; font-weight: 600; line-height: 1.2; overflow-wrap: anywhere }
.count { font-size: 13px; font-weight: 800; padding: 2px 10px; border-radius: 99px; background: var(--bg); color: var(--fg) }
.count.hot { background: var(--unpaid); color: #fff }
.count.today { background: var(--paid); color: #fff }
.tags { display: flex; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 15px }
.tags > span { display: inline-flex; align-items: center; gap: 6px }
.avatar { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; font-size: 12px; font-weight: 800; flex: none }
.note { font-size: 14px; color: var(--muted); background: var(--bg); border-radius: 12px; padding: 8px 12px; overflow-wrap: anywhere; white-space: pre-line }
.pays { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.pay { border: 2px solid var(--unpaid); background: transparent; color: var(--unpaid); border-radius: 16px; padding: 10px 8px;
  display: grid; text-align: center; transition: transform .12s }
.pay:active { transform: scale(.96) }
.pay .lbl { font-family: var(--f-display); font-size: 18px; font-weight: 700 }
.pay .st { font-size: 13px; font-weight: 800 }
.pay.paid { background: var(--paid); border-color: var(--paid); color: #fff }
.pay:disabled { cursor: default }

.empty { text-align: center; background: var(--card); border: 2px dashed var(--line); border-radius: 22px; padding: 36px 20px; color: var(--muted) }
.empty .big { font-size: 44px; line-height: 1 }
.empty p { margin: 10px 0 0 }

.fab { position: fixed; right: max(20px, calc(env(safe-area-inset-right, 0px) + 20px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  background: var(--primary); color: var(--primary-fg); border: none; border-radius: 99px; padding: 16px 24px; font-family: var(--f-display); font-size: 19px; font-weight: 600;
  box-shadow: 0 6px 0 rgba(0,0,0,.18); z-index: 5; display: inline-flex; align-items: center; gap: 8px }
.fab:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.18) }

.overlay { position: fixed; inset: 0; background: rgba(15, 17, 40, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 26px 26px 0 0;
  padding: 22px max(18px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(18px, env(safe-area-inset-left, 0px));
  display: grid; gap: 16px; animation: up .25s ease }
@media (min-width: 640px) { .overlay { align-items: center } .sheet { border-radius: 26px } }
@keyframes up { from { transform: translateY(40px); opacity: 0 } }
.sheet h2 { font-family: var(--f-display); font-size: 24px; margin: 0 }
.field { display: grid; gap: 8px }
.field > span { font-size: 14px; font-weight: 800; color: var(--muted) }
.sheet input { font: inherit; font-weight: 600; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; min-width: 0 }
.chips { display: flex; flex-wrap: wrap; gap: 8px }
.chip { border: 2px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 99px; padding: 8px 14px 8px 8px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px }
.chip.plain { padding-left: 14px }
.chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary); color: var(--primary-fg) }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.btn { border: 2px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 14px; padding: 12px 18px; font-weight: 800 }
.btn.main { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); flex: 1 }
.btn.del { border-color: var(--danger); color: var(--danger); background: transparent }
.btn.del.sure { background: var(--danger); color: #fff }
.msg { font-size: 14px; color: var(--danger); min-height: 1.2em; margin: 0 }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 92px); transform: translateX(-50%); background: var(--fg); color: var(--bg);
  padding: 10px 18px; border-radius: 99px; font-weight: 800; z-index: 30; max-width: calc(100% - 32px); text-align: center }
canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100% }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
html, body { margin: 0 }
[hidden] { display: none !important }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--muted) }
.topline .mail { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0 }
.linkbtn { background: none; border: none; color: var(--primary); font-weight: 800; padding: 4px 0; white-space: nowrap }
.login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.login form { background: var(--card); border: 2px solid var(--line); border-radius: 26px; box-shadow: 0 6px 0 var(--line); padding: 28px 22px; width: 100%; max-width: 400px; display: grid; gap: 14px }
.login .logo { width: 64px; height: 64px; margin: 0 auto }
.login h1 { text-align: center; font-size: 28px }
.login p.sub { text-align: center; color: var(--muted); margin: -6px 0 4px }
.login input { font: inherit; font-weight: 600; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%; min-width: 0 }
</style>
</head>
<body>
<div class="login" id="setup" hidden>
  <form onsubmit="return false">
    <img class="logo" src="icon.svg" alt="">
    <h1>Presque prêt</h1>
    <p class="sub">Le site n'est pas encore relié à sa base de données. Suivez les étapes du fichier INSTALLATION.md du dépôt, puis rechargez cette page.</p>
  </form>
</div>

<div class="login" id="login" hidden>
  <form id="loginForm" autocomplete="on">
    <img class="logo" src="icon.svg" alt="">
    <h1>Dates d'examen</h1>
    <p class="sub">Accès réservé. Connectez-vous pour continuer.</p>
    <label class="field"><span>E-mail</span><input id="loginEmail" type="email" autocomplete="username" inputmode="email"></label>
    <label class="field"><span>Mot de passe</span><input id="loginPass" type="password" autocomplete="current-password"></label>
    <p class="msg" id="loginMsg" role="status"></p>
    <button type="submit" class="btn main" id="loginBtn">Se connecter</button>
    <button type="button" class="linkbtn" id="forgotBtn">Mot de passe oublié</button>
  </form>
</div>

<div id="app" hidden>
<div class="wrap">
  <div class="topline"><span class="mail" id="userMail"></span><button type="button" class="linkbtn" id="logoutBtn">Se déconnecter</button></div>
  <header>
    <div>
      <h1>Dates d'examen <span class="car" aria-hidden="true">🚗</span></h1>
      <p class="summary" id="summary">Chargement…</p>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabNext" aria-selected="true">À venir</button>
      <button class="tab" role="tab" id="tabPast" aria-selected="false">Passés</button>
    </div>
  </header>
  <div class="list" id="list"></div>
</div>
</div>

<button class="fab" id="fab" type="button" hidden><span aria-hidden="true">＋</span> Nouvel examen</button>

<div class="overlay" id="overlay" hidden>
  <form class="sheet" id="sheet" autocomplete="off" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Nouvel examen</h2>
    <label class="field"><span>Élève</span><input id="eleve" maxlength="80" placeholder="Prénom et nom"></label>
    <div class="field"><span>Accompagnateur</span><div class="chips" id="accChips"></div></div>
    <div class="field"><span>Lieu</span><div class="chips" id="lieuChips"></div></div>
    <label class="field"><span>Date</span><input id="date" type="date"></label>
    <label class="field"><span>Commentaire (facultatif)</span><input id="commentaire" maxlength="300" placeholder="Ex. : apporter le livret"></label>
    <p class="msg" id="formMsg" role="status"></p>
    <div class="row-btns">
      <button type="submit" class="btn main" id="saveBtn">Ajouter</button>
      <button type="button" class="btn" id="cancelBtn">Annuler</button>
      <button type="button" class="btn del" id="delBtn" hidden>Supprimer</button>
    </div>
  </form>
</div>
<canvas id="confetti" hidden></canvas>


<script src="vendor/firebase/firebase-app-compat.js"></script>
<script src="vendor/firebase/firebase-auth-compat.js"></script>
<script src="vendor/firebase/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const ACCS = ["Towfiq", "Manel", "Monim", "Selim", "Walid", "Selma"];
  const LIEUX = ["Gennevilliers", "Noisy", "Bobigny"];
  const COLORS = ["#ef4444", "#f59e0b", "#10b981", "#0ea5e9", "#8b5cf6", "#ec4899", "#14b8a6", "#64748b"];
  const MONTHS = ["janv.", "févr.", "mars", "avr.", "mai", "juin", "juil.", "août", "sept.", "oct.", "nov.", "déc."];
  const DAYS = ["dim.", "lun.", "mar.", "mer.", "jeu.", "ven.", "sam."];
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  let col = null, rows = [], loaded = false, canWrite = true, view = "next";
  let editingId = null, selAcc = "", selLieu = "", delArmed = false;

  const todayStr = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const daysUntil = (s) => Math.round((parse(s) - parse(todayStr())) / 86400000);
  const shortDate = (s) => { const [y, m, d] = s.split("-").map(Number); return d + " " + MONTHS[m - 1] + (y !== new Date().getFullYear() ? " " + y : ""); };
  const isDate = (s) => typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s);
  function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function colorFor(name) { const i = ACCS.indexOf(name); if (i >= 0) return COLORS[i]; let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
  function avatar(name) { const a = el("span", "avatar", (name || "?").charAt(0).toUpperCase()); a.style.background = colorFor(name || "?"); a.setAttribute("aria-hidden", "true"); return a; }
  function toast(text) { const t = el("div", "toast", text); t.setAttribute("role", "status"); document.body.append(t); setTimeout(() => t.remove(), 1800); }

  function render() {
    if (!loaded) return;
    const list = $("list");
    const today = todayStr();
    const next = rows.filter(r => r.date >= today).sort((a, b) => a.date.localeCompare(b.date));
    const past = rows.filter(r => r.date < today).sort((a, b) => b.date.localeCompare(a.date));
    const unpaid = rows.reduce((n, r) => n + (r.payeW === true ? 0 : 1) + (r.payeB === true ? 0 : 1), 0);
    $("summary").textContent = (next.length === 0 ? "Aucun examen à venir" : next.length + " examen" + (next.length > 1 ? "s" : "") + " à venir")
      + (rows.length ? (unpaid ? " · " + unpaid + " paiement" + (unpaid > 1 ? "s" : "") + " en attente" : " · tout est payé 🎉") : "");
    const items = view === "next" ? next : past;
    list.replaceChildren();
    if (!items.length) {
      const e = el("div", "empty");
      e.append(el("div", "big", view === "next" ? "🚦" : "🏁"));
      e.append(el("p", null, view === "next" ? (rows.length ? "Aucun examen à venir." : "Aucun examen pour l'instant.") + (canWrite ? " Touchez « Nouvel examen » pour en ajouter un." : "") : "Aucun examen passé."));
      list.append(e);
      return;
    }
    items.forEach(r => list.append(card(r, r.date < today)));
  }

  function card(r, isPast) {
    const c = el("article", "card" + (isPast ? " past" : ""));
    const d = parse(r.date);
    const top = el("div", "top");
    const day = el("div", "day");
    day.append(el("div", "m", DAYS[d.getDay()]), el("div", "n", String(d.getDate())), el("div", "m", MONTHS[d.getMonth()]));
    const who = el("div", "who");
    const nr = el("div", "name-row");
    nr.append(el("span", "name", r.eleve));
    if (!isPast) {
      const n = daysUntil(r.date);
      nr.append(el("span", "count" + (n === 0 ? " today" : n <= 3 ? " hot" : ""), n === 0 ? "Aujourd'hui !" : n === 1 ? "Demain" : "J-" + n));
    }
    const tags = el("div", "tags");
    if (r.accompagnateur) { const t = el("span"); t.append(avatar(r.accompagnateur), r.accompagnateur); tags.append(t); }
    if (r.lieu) tags.append(el("span", null, "📍 " + r.lieu));
    who.append(nr, tags);
    top.append(day, who);
    c.append(top);
    if (typeof r.commentaire === "string" && r.commentaire.trim()) c.append(el("div", "note", "💬 " + r.commentaire));
    const pays = el("div", "pays");
    [["W", "payeW"], ["B", "payeB"]].forEach(([lbl, field]) => {
      const paid = r[field] === true;
      const b = el("button", "pay" + (paid ? " paid" : ""));
      b.type = "button";
      const pd = r[field + "Date"];
      b.append(el("span", "lbl", "Paiement " + lbl), el("span", "st", paid ? "✓ Payé" + (isDate(pd) ? " le " + shortDate(pd) : "") : "Pas encore payé"));
      b.setAttribute("aria-pressed", paid ? "true" : "false");
      b.disabled = !canWrite;
      b.onclick = (e) => { e.stopPropagation(); togglePay(r, field); };
      pays.append(b);
    });
    c.append(pays);
    if (canWrite) { c.tabIndex = 0; c.onclick = () => openSheet(r); c.onkeydown = (e) => { if (e.key === "Enter" && e.target === c) openSheet(r); }; }
    return c;
  }

  const busy = new Set();
  async function togglePay(r, field) {
    const key = r.id + field; if (busy.has(key)) return; busy.add(key);
    const nowPaid = r[field] !== true;
    try {
      await col.doc(r.id).update({ [field]: nowPaid, [field + "Date"]: nowPaid ? todayStr() : null });
      if (nowPaid) {
        const other = field === "payeW" ? "payeB" : "payeW";
        if (r[other] === true) { confetti(); toast("Tout est payé pour " + r.eleve + " 🎉"); }
        else toast("Paiement " + field.slice(-1) + " noté ✓");
      }
    } catch (e) { toast("Le paiement n'a pas pu être enregistré"); }
    finally { busy.delete(key); }
  }

  function renderChips(boxId, options, selected, onPick, withAvatar) {
    const box = $(boxId); box.replaceChildren();
    const opts = options.slice(); if (selected && !opts.includes(selected)) opts.push(selected);
    opts.forEach(o => {
      const b = el("button", "chip" + (withAvatar ? "" : " plain")); b.type = "button";
      if (withAvatar) b.append(avatar(o));
      b.append(withAvatar ? o : "📍 " + o);
      b.setAttribute("aria-pressed", o === selected ? "true" : "false");
      b.onclick = () => onPick(o);
      box.append(b);
    });
  }
  function drawChips() {
    renderChips("accChips", ACCS, selAcc, (v) => { selAcc = v; drawChips(); }, true);
    renderChips("lieuChips", LIEUX, selLieu, (v) => { selLieu = v; drawChips(); }, false);
  }
  function openSheet(r) {
    editingId = r ? r.id : null; delArmed = false;
    $("eleve").value = r ? r.eleve : "";
    $("date").value = r ? r.date : "";
    $("commentaire").value = r && typeof r.commentaire === "string" ? r.commentaire : "";
    selAcc = r ? (r.accompagnateur || "") : ""; selLieu = r ? (r.lieu || "") : "";
    $("sheetTitle").textContent = r ? "Modifier l'examen" : "Nouvel examen";
    $("saveBtn").textContent = r ? "Enregistrer" : "Ajouter";
    $("delBtn").hidden = !r; $("delBtn").classList.remove("sure"); $("delBtn").textContent = "Supprimer";
    $("formMsg").textContent = "";
    drawChips();
    $("overlay").hidden = false;
    if (!r) setTimeout(() => $("eleve").focus(), 50);
  }
  function closeSheet() { $("overlay").hidden = true; editingId = null; }

  $("fab").onclick = () => openSheet(null);
  $("cancelBtn").onclick = closeSheet;
  $("overlay").addEventListener("click", (e) => { if (e.target === $("overlay")) closeSheet(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("overlay").hidden) closeSheet(); });
  $("tabNext").onclick = () => setView("next");
  $("tabPast").onclick = () => setView("past");
  function setView(v) { view = v; $("tabNext").setAttribute("aria-selected", String(v === "next")); $("tabPast").setAttribute("aria-selected", String(v === "past")); render(); }

  $("delBtn").onclick = async () => {
    if (!delArmed) { delArmed = true; $("delBtn").classList.add("sure"); $("delBtn").textContent = "Oui, supprimer"; return; }
    const id = editingId; closeSheet();
    try { await col.doc(id).delete(); toast("Examen supprimé"); } catch (e) { toast("La suppression a échoué"); }
  };

  $("sheet").addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!col) { $("formMsg").textContent = "Connectez-vous d'abord."; return; }
    const data = { eleve: $("eleve").value.trim(), accompagnateur: selAcc, lieu: selLieu, date: $("date").value, commentaire: $("commentaire").value.trim() };
    const missing = [!data.eleve && "l'élève", !data.accompagnateur && "l'accompagnateur", !data.lieu && "le lieu", !data.date && "la date"].filter(Boolean);
    if (missing.length) { $("formMsg").textContent = "Il manque " + missing.join(", ") + "."; return; }
    $("saveBtn").disabled = true;
    try {
      if (editingId) { await col.doc(editingId).update(Object.assign(data, { modifieLe: firebase.firestore.FieldValue.serverTimestamp() })); toast("Examen modifié ✓"); }
      else { await col.add(Object.assign(data, { payeW: false, payeB: false, creeLe: firebase.firestore.FieldValue.serverTimestamp(), creePar: (auth.currentUser && auth.currentUser.email) || "" })); toast("Examen ajouté 🚗"); if (data.date >= todayStr()) setView("next"); }
      closeSheet();
    } catch (err) {
      if (err && /permission/i.test(err.code + " " + err.message)) $("formMsg").textContent = "Ce compte ne peut pas modifier la liste.";
      else $("formMsg").textContent = "L'enregistrement a échoué. Réessayez.";
    } finally { $("saveBtn").disabled = false; }
  });

  function confetti() {
    if (reduce) return;
    const cv = $("confetti"); cv.hidden = false;
    const ctx = cv.getContext("2d"); const W = cv.width = innerWidth, H = cv.height = innerHeight;
    const ps = Array.from({ length: 90 }, () => ({ x: W / 2, y: H * 0.6, vx: (Math.random() - .5) * 12, vy: -Math.random() * 14 - 6, r: Math.random() * 6 + 4, c: COLORS[Math.floor(Math.random() * 6)], a: Math.random() * 6 }));
    let t = 0;
    (function frame() {
      ctx.clearRect(0, 0, W, H);
      ps.forEach(p => { p.vy += .45; p.x += p.vx; p.y += p.vy; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); ctx.restore(); });
      if (++t < 90) requestAnimationFrame(frame); else { ctx.clearRect(0, 0, W, H); cv.hidden = true; }
    })();
  }

  // ---------- connexion et données (Firebase) ----------
  let fs = null, auth = null, unsub = null;
  function showLogin(text) {
    $("app").hidden = true; $("login").hidden = false; $("fab").hidden = true;
    $("loginMsg").textContent = text || "";
  }
  function showApp(user) {
    $("login").hidden = true; $("app").hidden = false; $("fab").hidden = !canWrite;
    $("userMail").textContent = user.email || "";
  }
  function startCloud() {
    const cfg = window.FIREBASE_CONFIG;
    if (!cfg || !cfg.apiKey || !window.firebase) { $("setup").hidden = false; return; }
    firebase.initializeApp(cfg);
    auth = firebase.auth(); fs = firebase.firestore();
    fs.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    auth.onAuthStateChanged((u) => {
      if (unsub) { unsub(); unsub = null; }
      rows = []; loaded = false; col = null;
      if (!u) { showLogin(""); return; }
      canWrite = true; showApp(u);
      $("summary").textContent = "Chargement…"; $("list").replaceChildren();
      col = fs.collection("dates_examen");
      unsub = col.onSnapshot((snap) => {
        loaded = true;
        rows = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).filter(r => typeof r.eleve === "string" && isDate(r.date));
        render();
      }, (err) => {
        loaded = true;
        if (/permission/i.test((err && (err.code + " " + err.message)) || "")) {
          auth.signOut();
          showLogin("Ce compte n'a pas accès aux dates d'examen.");
        } else { $("summary").textContent = "Impossible de charger la liste. Vérifiez la connexion."; }
      });
    });
  }
  $("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const mail = $("loginEmail").value.trim(), pass = $("loginPass").value;
    if (!mail || !pass) { $("loginMsg").textContent = "Entrez votre e-mail et votre mot de passe."; return; }
    $("loginBtn").disabled = true; $("loginMsg").textContent = "";
    try { await auth.signInWithEmailAndPassword(mail, pass); $("loginPass").value = ""; }
    catch (err) {
      const c = (err && err.code) || "";
      $("loginMsg").textContent = /wrong-password|invalid-credential|user-not-found|invalid-login/.test(c) ? "E-mail ou mot de passe incorrect."
        : /too-many-requests/.test(c) ? "Trop d'essais. Réessayez dans quelques minutes."
        : /network/.test(c) ? "Pas de connexion internet." : "Connexion impossible. Réessayez.";
    } finally { $("loginBtn").disabled = false; }
  });
  $("forgotBtn").onclick = async () => {
    const mail = $("loginEmail").value.trim();
    if (!mail) { $("loginMsg").textContent = "Écrivez d'abord votre e-mail, puis touchez « Mot de passe oublié »."; return; }
    try { await auth.sendPasswordResetEmail(mail); $("loginMsg").textContent = "Un e-mail pour changer le mot de passe vient d'être envoyé."; }
    catch (err) { $("loginMsg").textContent = "Envoi impossible. Vérifiez l'adresse e-mail."; }
  };
  $("logoutBtn").onclick = async () => {
    if (unsub) { unsub(); unsub = null; }
    try { await auth.signOut(); } catch (_) {}
    try { await fs.terminate(); await fs.clearPersistence(); } catch (_) {}
    location.reload();
  };
  startCloud();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
